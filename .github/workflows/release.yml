name: Release

# Every six hours: has decky-lsfg-vk, Decky-Framegen or HelixSR Manager
# published a newer STABLE release (GitHub's "latest release"; pre-releases
# never count)? If so the plugin is rebuilt with it, all tests run, and only
# when they pass is the new version committed, tagged and released. A build
# that fails publishes nothing and opens an issue instead, so the last good
# release stays the one people get.
#
# "Run workflow" by hand does the same, and can also release the current
# state without an upstream change (after changes to Frame Suite itself).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Release even if no upstream plugin changed"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04  # GNU coreutils, as on SteamOS (MAKO's tests copy /usr/bin/env)
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Look for new stable upstream releases
        id: check
        run: node scripts/upstreams.mjs check

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "true" ] || [ "${{ inputs.release }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new upstream." >> "$GITHUB_STEP_SUMMARY"
          fi

      # GitHub switches scheduled workflows off in a repository without activity for 60 days.
      # A quiet stretch upstream must not end the automatic updates.
      - name: Keep the schedule alive
        if: steps.decide.outputs.go != 'true' && github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%d > .github/last-upstream-check
            git add .github/last-upstream-check
            git commit -m "Upstream check: nothing new (keeps the scheduled check running)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Version
        if: steps.decide.outputs.go == 'true'
        id: version
        run: |
          current=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            next=$current        # this version has not been released yet
          else
            # x.y.z: z up to 10, then y up to 20, then x (scripts/next-version.mjs)
            next=$(node scripts/next-version.mjs)
            npm version "$next" --no-git-tag-version >/dev/null
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.decide.outputs.go == 'true'
        id: build
        env:
          FRAME_SUITE_REQUIRE_INTEGRATION: "1"
        run: |
          node scripts/upstreams.mjs fetch
          node scripts/build.mjs --test

      - name: Commit, tag and publish
        if: steps.decide.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstreams.json package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release $VERSION${{ steps.check.outputs.title && format(': {0}', steps.check.outputs.title) || '' }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          {
            echo "Install: Decky → Settings → Developer → Install Plugin from ZIP File → \`frame-suite.zip\`. An installed Frame Suite offers this update by itself (Chip, versions and updates)."
            echo
            if [ -n "$SUMMARY" ]; then echo "**New in this build**"; echo; echo "$SUMMARY"; echo; fi
            echo "**Inside**"
            echo
            node -e "const l=require('./upstreams.json').upstreams;for(const u of Object.values(l))console.log('- '+u.title+' '+u.tag+' (https://github.com/'+u.repo+')')"
          } > notes.md
          gh release create "v$VERSION" out/frame-suite.zip --target "$(git rev-parse HEAD)" \
            --title "Frame Suite $VERSION" --notes-file notes.md --latest
          # A fixed earlier failure needs no open issue any more.
          for n in $(gh issue list --state open --label upstream-build --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed: v$VERSION was built and released."
          done

      - name: Report a failed upstream update
        if: failure() && steps.decide.outputs.go == 'true'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          gh label create upstream-build --color B60205 --description "A new upstream release did not build" 2>/dev/null || true
          body="A new build did not pass and was **not released**; the last release stays in place.

          ${SUMMARY:-No upstream change (manual run).}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Usual causes: an upstream plugin renamed a backend method Frame Suite calls (tests/test_contract.py says which), or changed how it is built."
          # One issue per failing change; the six-hourly retries do not repeat themselves in it.
          title="Not released: ${{ steps.check.outputs.title || 'manual build' }} did not build"
          same=$(gh issue list --state open --label upstream-build --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -z "$same" ]; then gh issue create --title "$title" --label upstream-build --body "$body"; fi
